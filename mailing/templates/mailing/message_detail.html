{% extends 'mailing/base.html' %}

{% block title %}Детали сообщения{% endblock %}

{% block content %}
<!--{% include 'mailing/header.html' %}-->
<h2>Детали сообщения</h2>
<p>Тема: {{ message.subject }}</p>
<p>Сообщение: {{ message.body }}</p>
<a href="{% url 'mailing:message_update' message.pk %}" class="p-2 btn btn-outline-primary">Редактировать</a>
<a href="{% url 'mailing:message_delete' message.pk %}" class="p-2 btn btn-outline-danger">Удалить</a>
<a href="{% url 'mailing:message_list' %}" class="p-2 btn btn-outline-primary">Вернуться к списку</a>

{% endblock %}
