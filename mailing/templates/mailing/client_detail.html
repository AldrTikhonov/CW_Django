{% extends 'mailing/base.html' %}

{% block title %}Детали клиента{% endblock %}

{% block content %}
<!--{% include 'mailing/header.html' %}-->
<h2>Детали клиента</h2>
<p>Email: {{ client.email }}</p>
<p>Комментарий: {{ client.comment }}</p>
<a href="{% url 'mailing:client_update' client.pk %}" class="p-2 btn btn-outline-primary">Редактировать</a>
<a href="{% url 'mailing:client_delete' client.pk %}" class="p-2 btn btn-outline-danger">Удалить</a>
<a href="{% url 'mailing:client_list' %}" class="p-2 btn btn-outline-primary">Вернуться к списку</a>
{% endblock %}
