{% extends 'mailing/base.html' %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}
{% include 'mailing/header.html' %}
<h2>Удаление рассылки</h2>
<p>Вы действительно хотите удалить рассылку?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="p-2 btn btn-danger">Подтвердить</button>
    <a href="{% url 'mailing:mailing_list' %}" class="p-2 btn btn-outline-primary">Отменить</a>
</form>
{% endblock %}
